<!DOCTYPE html>
<html lang=

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Fornecedores - Ciabrasil</title>

<style>

:root{
    --azul:#0A68A7;
    --verde:#AFCA0A;
}

body{
    background:#f3f5f7;
    font-family:Segoe UI, Arial, sans-serif;
    margin:0;
}

.container{
    max-width:1200px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.topo{
    display:flex;
    align-items:center;
    gap:20px;
    border-bottom:1px solid #e5e5e5;
    padding-bottom:20px;
    margin-bottom:30px;
}

.topo img{
    height:55px;
    width:auto;
}

.topo h1{
    margin:0;
    color:var(--azul);
}

.subtitulo{
    color:#666;
    margin-top:5px;
}

h2{
    color:var(--azul);
    border-bottom:2px solid #e5e5e5;
    padding-bottom:10px;
    margin-top:35px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.full{
    grid-column:1 / 3;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d9d9d9;
    border-radius:6px;
    box-sizing:border-box;
}

input[readonly]{
    background:#f7f7f7;
    color:#555;
}

textarea{
    min-height:100px;
}

button{
    border:none;
    padding:14px 25px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.btn-consultar{
    background:var(--verde);
}

.btn-enviar{
    background:var(--azul);
    color:white;
    width:100%;
    margin-top:25px;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .topo{
        flex-direction:column;
        text-align:center;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="topo">

logo-ciabrasil.png

<div>
<h1>Cadastro de Fornecedores</h1>
<div class="subtitulo">
Preencha os dados para análise cadastral.
</div>
</div>

</div>

<h2>Dados da empresa</h2>

<div class="grid">

<div class="full">
<label>CNPJ</label>
<input id="cnpj">
</div>

<div class="full">
<button class="btn-consultar" onclick="consultarCNPJ()">
Consultar CNPJ
</button>
</div>

<div class="full">
<label>Razão Social</label>
<input id="razaoSocial" readonly>
</div>

<div class="full">
<label>Nome Fantasia</label>
<input id="nomeFantasia" readonly>
</div>

<div>
<label>Cidade</label>
<input id="cidade" readonly>
</div>

<div>
<label>UF</label>
<input id="uf" readonly>
</div>

<div>
<label>CEP</label>
<input id="cep" readonly>
</div>

<div>
<label>Telefone</label>
<input id="telefone" readonly>
</div>

<div class="full">
<label>Situação Cadastral</label>
<input id="situacao" readonly>
</div>

<div class="full">
<label>CNAE Principal</label>
<input id="cnae" readonly>
</div>

</div>

<h2>Contato</h2>

<div class="grid">

<div>
<label>Responsável</label>
<input id="responsavel">
</div>

<div>
<label>E-mail</label>
<input id="email">
</div>

<div>
<label>Celular</label>
<input id="celular">
</div>

<div>
<label>Regime Tributário</label>
<select id="regime">
<option>Selecione...</option>
<option>Simples Nacional</option>
<option>Lucro Presumido</option>
<option>Lucro Real</option>
</select>
</div>

<div class="full">
<label>Observações</label>
<textarea id="observacoes"></textarea>
</div>

</div>

<button class="btn-enviar">
Enviar Cadastro
</button>

</div>

<script>

async function consultarCNPJ(){

    try{

        const cnpj =
            document.getElementById("cnpj")
            .value.replace(/\D/g,'');

        const resposta =
            await fetch(
            `https://brasilapi.com.br/api/cnpj/v1/${cnpj}`
            );

        const dados =
            await resposta.json();

        document.getElementById("razaoSocial").value =
            dados.razao_social || '';

        document.getElementById("nomeFantasia").value =
            dados.nome_fantasia || '';

        document.getElementById("cidade").value =
            dados.municipio || '';

        document.getElementById("uf").value =
            dados.uf || '';

        document.getElementById("cep").value =
            dados.cep || '';

        document.getElementById("telefone").value =
            dados.ddd_telefone_1 || '';

        document.getElementById("situacao").value =
            dados.descricao_situacao_cadastral || '';

        document.getElementById("cnae").value =
            dados.cnae_fiscal_descricao || '';

    }
    catch{

        alert("Não foi possível consultar o CNPJ.");

    }

}

</script>

</body>
</html>
